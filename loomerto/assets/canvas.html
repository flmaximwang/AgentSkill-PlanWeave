<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loomerto 画布</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --ink:#1f2328; --dim:#6b7280;
    --done:#2e7d32; --review:#c98a00; --running:#1565c0; --claimed:#6a1b9a;
    --ready:#00838f; --waiting:#9aa0a6; --pending:#9aa0a6; --blocked:#c62828;
    --cancelled:#8d9199; --editw:390px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
       display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);
         border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  header h1{font-size:15px;margin:0}
  header .goal{color:var(--dim);font-size:12px;max-width:38ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .spacer{flex:1}
  header .meta{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  button{font:inherit;padding:4px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  button:hover{border-color:#b9c0c9;background:#fafbfc}
  button.primary{background:#1565c0;border-color:#1565c0;color:#fff}
  button.primary:hover{background:#12559f}
  button.ghost{border-style:dashed;color:var(--dim)}
  #msg{font-size:12px;min-width:8ch}
  #msg.err{color:var(--bad,#c62828)} #msg.ok{color:var(--done)}
  main{flex:1;display:flex;min-height:0;padding-right:var(--editw);position:relative}
  #board{flex:1;overflow:auto;padding:14px 16px 60px;position:relative}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;padding:8px 12px 12px}
  .lanehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 8px}
  .lanehead .tid{font-weight:600;font-variant-numeric:tabular-nums}
  .lanehead .deps{color:var(--dim);font-size:12px}
  .lanehead .spacer{flex:1}
  .cards{display:flex;gap:10px;flex-wrap:wrap;min-height:34px}
  .cards.over{outline:2px dashed #1565c0;outline-offset:4px;border-radius:8px}
  .card{width:196px;border:1px solid var(--line);border-left:5px solid var(--waiting);border-radius:8px;
        background:#fff;padding:7px 9px 8px;cursor:pointer;position:relative}
  .card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card.sel{border-color:#1565c0;box-shadow:0 0 0 2px rgba(21,101,192,.25)}
  .card.drag{opacity:.45}
  .card .cid{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .card .ctitle{font-size:13px;margin:2px 0 5px;word-break:break-word}
  .card .cmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim)}
  .badge{display:inline-block;padding:1px 6px;border-radius:999px;font-size:11px;color:#fff;background:var(--waiting)}
  .badge.done{background:var(--done)} .badge.review{background:var(--review)}
  .badge.running{background:var(--running)} .badge.claimed{background:var(--claimed)}
  .badge.ready{background:var(--ready)} .badge.waiting{background:var(--waiting)}
  .badge.pending{background:var(--pending)} .badge.blocked{background:var(--blocked)}
  .badge.cancelled{background:var(--cancelled)}
  .card.st-done{border-left-color:var(--done)} .card.st-review{border-left-color:var(--review)}
  .card.st-running{border-left-color:var(--running)} .card.st-claimed{border-left-color:var(--claimed)}
  .card.st-ready{border-left-color:var(--ready)} .card.st-waiting{border-left-color:var(--waiting)}
  .card.st-pending{border-left-color:var(--pending)} .card.st-blocked{border-left-color:var(--blocked)}
  .card.st-cancelled{border-left-color:var(--cancelled);opacity:.6}
  #edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #edges path{fill:none;stroke:#b6bdc7;stroke-width:1.5;marker-end:url(#arw)}
  aside{position:fixed;top:0;right:0;bottom:0;width:var(--editw);background:var(--panel);border-left:1px solid var(--line);
        padding:12px 14px 24px;overflow:auto}
  aside h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  aside .hint{color:var(--dim);font-size:12px}
  label{display:block;font-size:12px;color:var(--dim);margin:9px 0 3px}
  input,textarea,select{width:100%;font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
  textarea{min-height:56px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .kv{font-size:12px;color:var(--dim);margin-top:10px}
  .kv code{color:var(--ink)}
  ul.runs{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--dim)}
  .legend{color:var(--dim);font-size:12px;padding:0 0 8px}
</style>
</head>
<body>
<header>
  <h1 id="title">…</h1>
  <span class="goal" id="goal"></span>
  <span class="spacer"></span>
  <span class="meta" id="progress"></span>
  <span class="meta" id="rev"></span>
  <span id="msg"></span>
  <button id="refresh" title="重新从数据文件读一遍">刷新</button>
  <button id="addtask" class="primary">＋ 任务</button>
</header>

<main>
  <div id="board">
    <div class="legend" id="legend"></div>
    <div id="lanes"></div>
    <svg id="edges"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b6bdc7"/></marker></defs></svg>
  </div>
  <aside id="editor"></aside>
</main>

<script>
"use strict";
let VIEW = null;         // 服务端算好的一屏数据（派生状态/依赖/认领都由 model 算）
let SEL = null;          // 选中的块 id
let DRAG = null;         // 正在拖的块
const $ = (s) => document.querySelector(s);
// 所有插进 innerHTML 的内容一律先过 esc()（自己的 plan 数据、只绑 127.0.0.1，但一样按不可信处理）
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ZH = {done:"已完成",running:"进行中",claimed:"已认领",review:"待评审",ready:"待认领",
            waiting:"等前置",pending:"待排",blocked:"待批准",cancelled:"已取消"};
const zh = (s) => ZH[s] || s;
const blockOf = (id) => { for (const t of (VIEW?.tasks||[])) for (const b of t.blocks) if (b.id === id) return [t,b]; return [null,null]; };

function msg(text, cls){ const m = $("#msg"); m.textContent = text || ""; m.className = cls || ""; }

async function api(op, payload){
  const body = Object.assign({op, rev: VIEW?.rev || ""}, payload || {});
  const r = await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok:false, error:"服务回了非 JSON"}));
  if (!r.ok || !j.ok){ msg("✗ " + (j.error || r.status), "err"); return false; }
  VIEW = j.view; msg("✓ " + (j.msg || "已保存"), "ok"); render();
  return true;
}

async function load(){
  const r = await fetch("/api/plan");
  const j = await r.json();
  if (!j.ok){ msg("✗ " + j.error, "err"); return; }
  VIEW = j.view; msg("", ""); render();
}

// ---------------------------------------------------------------- 画
function render(){
  if (!VIEW) return;
  const v = VIEW;
  $("#title").textContent = v.title || v.slug;
  $("#goal").textContent = v.goal || "";
  $("#progress").textContent = `${v.progress[0]}/${v.progress[1]} 块`;
  $("#rev").textContent = "rev " + (v.rev || "").replace("T", " ").slice(0, 16);
  $("#legend").textContent = "颜色 / 状态：" + v.block_statuses.map(s => zh(s)).join(" · ")
                             + "　（拖动卡片 = 改这条泳道里的先后；跨泳道移动暂不支持）";
  const lanes = $("#lanes");
  lanes.innerHTML = "";
  for (const t of v.tasks){
    const sec = document.createElement("section");
    sec.className = "lane"; sec.dataset.task = t.id;
    sec.innerHTML =
      `<div class="lanehead"><span class="tid">${esc(t.id)}</span><b>${esc(t.title)}</b>
         <span class="badge ${esc(t.status)}">${esc(zh(t.status))}</span>
         <span class="deps">${t.owner ? "@"+esc(t.owner) : "未指派"}${t.deps.length ? " · 前置 "+t.deps.map(esc).join("、") : ""}</span>
         <span class="spacer"></span>
         <button class="addblock ghost" data-task="${esc(t.id)}">＋ 块</button></div>
       <div class="cards"></div>`;
    const cards = sec.querySelector(".cards");
    for (const b of t.blocks) cards.appendChild(cardEl(b));
    lanes.appendChild(sec);
  }
  document.querySelectorAll("button.addblock").forEach(btn =>
    btn.addEventListener("click", () => newBlockForm(btn.dataset.task)));
  wireDnD();
  drawEdges();
  editor();
}

function cardEl(b){
  const el = document.createElement("div");
  el.className = "card st-" + b.status + (SEL === b.id ? " sel" : "");
  el.dataset.id = b.id; el.draggable = true;
  const ex = b.exec && b.exec.by ? `在做 @${esc(b.exec.by)}` : "";
  el.innerHTML =
    `<div class="cid">${esc(b.id.split("#")[1])}${b.kind ? " · " + esc(b.kind) : ""}${b.rework ? " ⟲"+b.rework : ""}</div>
     <div class="ctitle">${esc(b.title)}</div>
     <div class="cmeta"><span class="badge ${b.status}">${esc(zh(b.status))}</span>
       ${b.owner ? `<span>@${esc(b.owner)}</span>` : ""}${ex ? `<span>${ex}</span>` : ""}</div>`;
  el.addEventListener("click", () => { SEL = (SEL === b.id ? null : b.id); render(); });
  return el;
}

function drawEdges(){
  const svg = $("#edges"), board = $("#board");
  const bb = board.getBoundingClientRect();
  const pos = {};
  document.querySelectorAll(".card").forEach(c => {
    const r = c.getBoundingClientRect();
    pos[c.dataset.id] = {l:r.left-bb.left+board.scrollLeft, r:r.right-bb.left+board.scrollLeft, y:r.top-bb.top+board.scrollTop+r.height/2};
  });
  const paths = [];
  for (const [from,to] of (VIEW.edges||[])){
    if (!pos[from] || !pos[to]) continue;
    const a = pos[from], b = pos[to];
    const mid = (a.r + b.l) / 2;
    paths.push(`<path d="M${a.r} ${a.y} C${mid} ${a.y} ${mid} ${b.y} ${b.l} ${b.y}"/>`);
  }
  svg.innerHTML = `<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b6bdc7"/></marker></defs>` + paths.join("");
  svg.style.height = board.scrollHeight + "px";
}
window.addEventListener("resize", () => drawEdges());
document.addEventListener("scroll", () => drawEdges(), true);

// ---------------------------------------------------------------- 拖 = 改先后（同泳道内）
function wireDnD(){
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("dragstart", e => {
      DRAG = {id: card.dataset.id};
      e.dataTransfer.setData("text/plain", card.dataset.id);
      card.classList.add("drag");
    });
    card.addEventListener("dragend", () => { card.classList.remove("drag"); DRAG = null; });
    card.addEventListener("dragover", e => e.preventDefault());
    card.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      if (!DRAG || DRAG.id === card.dataset.id) return;
      const [t1,b1] = blockOf(DRAG.id), [t2] = blockOf(card.dataset.id);
      if (!t1 || !t2) return;
      if (t1.id !== t2.id){
        msg("跨泳道移动会改块 id 与依赖接线，画布暂不支持（用 expand / collapse / block 命令）", "err");
        return;
      }
      const ids = t1.blocks.map(b => b.id).filter(x => x !== DRAG.id);
      ids.splice(ids.indexOf(card.dataset.id), 0, DRAG.id);
      api("reorder", {task: t1.id, order: ids});
    });
  });
  document.querySelectorAll(".lane").forEach(lane => {
    const cards = lane.querySelector(".cards");
    cards.addEventListener("dragover", e => { e.preventDefault(); cards.classList.add("over"); });
    cards.addEventListener("dragleave", () => cards.classList.remove("over"));
    cards.addEventListener("drop", e => {
      cards.classList.remove("over");
      const [tFrom] = DRAG ? blockOf(DRAG.id) : [null];
      if (tFrom && tFrom.id !== lane.dataset.task)
        msg("跨泳道移动会改块 id 与依赖接线，画布暂不支持", "err");
    });
  });
}

// ---------------------------------------------------------------- 右栏
function field(label, id, value, tag){
  const t = tag || "input";
  const v = tag === "textarea" ? esc(value) : esc(value);
  return `<label for="${id}">${label}</label><${t} id="${id}">${v}</${t}>`;
}
function select(id, options, cur, zhMap){
  return `<select id="${id}">` + options.map(o =>
    `<option value="${esc(o)}"${o === cur ? " selected" : ""}>${esc(zhMap ? zhMap(o) : o)}</option>`).join("") + "</select>";
}

function editor(){
  const box = $("#editor");
  if (NEWFORM){ box.innerHTML = NEWFORM.html; wireNewForm(); return; }
  const [t,b] = SEL ? blockOf(SEL) : [null,null];
  if (!b){
    box.innerHTML = `<h2>画布</h2><p class="hint">点一个块来编辑；拖卡片改同泳道内的先后。</p>
      <div class="kv">数据文件：<code>${esc(VIEW.file)}</code><br>
      每次保存都会写回这份 json，并同步 PLAN.md / plan.html / plan.canvas。</div>
      <div class="kv">能改：标题 · 做什么 · 判据 · 认领人 · 类型 · 状态（含送审 / 打回 / 收工）· 新建任务与块。<br>
      暂不提供：删块、跨泳道移动、改依赖接线 —— 这些会一脚踩坏判据或改块 id，走命令更安全。</div>`;
    return;
  }
  const parts = VIEW.participants.map(p => `<option value="${esc(p.id)}">`).join("");
  box.innerHTML = `
    <h2>${esc(b.id)} <span class="badge ${b.status}">${esc(zh(b.status))}</span></h2>
    <p class="hint">派生状态由依赖算出：<b>${esc(zh(b.status))}</b>${b.status !== b.raw_status ? `（内部 ${esc(b.raw_status)}，被依赖挡着）` : ""}</p>
    <label for="f_title">标题</label><input id="f_title" value="${esc(b.title)}">
    <label for="f_doc">做什么（doc）</label><textarea id="f_doc">${esc(b.doc)}</textarea>
    <label for="f_done">判据（一行一条）</label><textarea id="f_done">${esc((b.done_when||[]).join("\n"))}</textarea>
    <div class="row">
      <div><label for="f_owner">认领人</label><input id="f_owner" list="people" value="${esc(b.owner)}"><datalist id="people">${parts}</datalist></div>
      <div><label for="f_kind">类型</label>${select("f_kind", VIEW.kinds, b.kind)}</div>
    </div>
    <div class="row">
      <div><label for="f_status">状态</label>${select("f_status", VIEW.block_statuses, b.status, zh)}</div>
      <div><label for="f_by">在做（--by）</label><input id="f_by" list="people" value="${esc((b.exec||{}).by||"")}"></div>
    </div>
    <label for="f_note">说明（改状态的 note；打回时落进 feedback）</label><input id="f_note" value="">
    <div class="btns">
      <button class="primary" id="save">保存字段</button>
      <button id="setst">改状态</button>
      <button id="rework" class="ghost" title="回到「已认领」，note 落进 feedback">打回重做</button>
    </div>
    <div class="kv">归属 ${esc(t.id)} ${esc(t.title)} · 依赖 ${(b.deps||[]).length ? b.deps.map(esc).join("、") : "—"}
      ${b.review_of ? "<br>评审对象 <code>" + esc(b.review_of) + "</code>" : ""}
      ${b.feedback ? "<br>feedback：" + esc(b.feedback) : ""}
      ${(b.artifacts||[]).length ? "<br>产物：" + b.artifacts.map(esc).join("<br>") : ""}
      ${(b.exec||{}).delegation ? "<br>线程 <code>" + esc(b.exec.delegation) + "#" + esc(b.exec.task_index||0) + "</code>" : ""}</div>
    ${(b.runs||[]).length ? "<div class='kv'>最近 run：<ul class='runs'>" +
      b.runs.map(r => `<li>${esc((r.at||"").replace("T"," ").slice(0,16))} ${esc(r.by||"")} ${esc(r.from||"")}→${esc(r.to||"")} ${esc(r.note||"")}</li>`).join("") + "</ul></div>" : ""}`;
  const val = (id) => $("#" + id).value;
  const fields = () => ({ref: b.id, title: val("f_title"), doc: val("f_doc"),
                         done_when: val("f_done").split("\n").map(s => s.trim()).filter(Boolean),
                         owner: val("f_owner"), kind: val("f_kind"), by: val("f_by"), note: val("f_note")});
  $("#save").addEventListener("click", () => api("edit", fields()));
  $("#setst").addEventListener("click", () => api("status", Object.assign(fields(), {status: val("f_status")})));
  $("#rework").addEventListener("click", () => api("status", Object.assign(fields(), {status: "claimed"})));
}

// ---------------------------------------------------------------- 新建
let NEWFORM = null;
let taskOfNewForm = "";
function newBlockForm(taskId){
  SEL = null; taskOfNewForm = taskId;
  NEWFORM = {html: `<h2>在 ${esc(taskId)} 里新建块</h2>
    <label for="n_title">标题</label><input id="n_title">
    <label for="n_doc">做什么（doc）</label><textarea id="n_doc"></textarea>
    <label for="n_done">判据（一行一条，可核验）</label><textarea id="n_done"></textarea>
    <div class="row">
      <div><label for="n_kind">类型</label>${select("n_kind", VIEW.kinds, "impl")}</div>
      <div><label for="n_status">初始状态</label>${select("n_status", ["pending","blocked"], "pending", zh)}</div>
    </div>
    <label for="n_owner">认领人</label><input id="n_owner" list="people">
    <div class="btns"><button class="primary" id="n_go">新建</button><button id="n_cancel">取消</button></div>
    <p class="hint">默认「待排」（<code>pending</code>）—— 你就是在画布上批准它的人；要留给人点头就选「待批准」。</p>`};
  render();
}
function newTaskForm(){
  SEL = null;
  NEWFORM = {html: `<h2>新建任务（泳道）</h2>
    <label for="n_title">标题</label><input id="n_title">
    <label for="n_owner">认领人</label><input id="n_owner" list="people">
    <label for="n_deps">前置任务（逗号分隔，可空）</label><input id="n_deps">
    <div class="btns"><button class="primary" id="n_go">新建</button><button id="n_cancel">取消</button></div>`};
  render();
}
function wireNewForm(){
  $("#n_cancel").addEventListener("click", () => { NEWFORM = null; render(); });
  $("#n_go").addEventListener("click", async () => {
    const title = $("#n_title").value.trim();
    const owner = $("#n_owner") ? $("#n_owner").value.trim() : "";
    if (!title){ msg("✗ 要有标题", "err"); return; }
    const isBlock = !!$("#n_done");
    const payload = isBlock
      ? {task: taskOfNewForm,
         title, doc: $("#n_doc").value, done_when: $("#n_done").value.split("\n").map(s=>s.trim()).filter(Boolean),
         kind: $("#n_kind").value, status: $("#n_status").value, owner}
      : {title, owner, deps: $("#n_deps").value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean)};
    const ok = await api(isBlock ? "block" : "task", payload);
    if (ok) NEWFORM = null;
    render();
  });
}

// ---------------------------------------------------------------- 启动
$("#refresh").addEventListener("click", load);
$("#addtask").addEventListener("click", newTaskForm);
document.addEventListener("keydown", e => { if (e.key === "Escape" && SEL){ SEL = null; render(); } });
load();
</script>
</body>
</html>
