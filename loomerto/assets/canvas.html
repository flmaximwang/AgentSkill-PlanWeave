<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loomerto 画布</title>
<style>
  /*__THEME__*/
  /* ↓ 只放这一页的**布局**规则：颜色 / 字体 / 状态胶囊(.pill) / 按钮(.btn) / 分隔线(#splitter) /
     进度条(.track) / 图例(.legend) 全来自上面的共用主题 theme.css（与只读看板 plan.html 同一份）。 */
  :root{ --detail-w:390px; }        /* 详情栏宽度：拖动分隔线后由 JS 写成固定 px */
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding-right:var(--detail-w)}
  header{padding:20px 24px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .meta .spacer{margin-left:auto}
  #msg{font-size:12px;min-width:6ch}
  #msg.err{color:var(--blocked)} #msg.ok{color:var(--done)}
  main{flex:1;display:flex;min-height:0;position:relative}
  #board{flex:1;overflow:auto;padding:16px 24px 60px;position:relative}
  #splitter{right:var(--detail-w)}     /* 其余（宽度/细线/hover）在共用主题里 */
  .fullbtn{display:block;width:100%;margin:2px 0 8px;padding:10px;border:1px dashed var(--line);
           border-radius:12px;background:transparent;color:var(--dim);text-align:center;
           font:inherit;font-size:13px;cursor:pointer}
  .fullbtn:hover{border-color:var(--dim);background:var(--panel);color:var(--ink)}
  .lane{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        box-shadow:var(--shadow);margin:0 0 12px;padding:10px 14px 12px}
  .lanehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 8px}
  .lanehead .tid{font-weight:600;font-variant-numeric:tabular-nums}
  .lanehead .deps{color:var(--dim);font-size:12px}
  .cards{display:flex;gap:10px;flex-wrap:wrap;min-height:34px}
  .cards.over{outline:2px dashed var(--running);outline-offset:4px;border-radius:8px}
  .card{width:200px;border:1px solid var(--line);border-left:4px solid var(--waiting);border-radius:10px;
        background:var(--panel);box-shadow:var(--shadow);padding:8px 10px;cursor:pointer;
        transition:transform .12s}
  .card:hover{transform:translateY(-2px)}
  .card.sel{outline:2px solid var(--running)}
  .card.drag{opacity:.45}
  .card .cid{font-size:11px;color:var(--dim);font-family:var(--mono);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .ctitle{font-size:13px;font-weight:600;margin:3px 0 5px;line-height:1.3;
                display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--dim)}
  .card.st-done{border-left-color:var(--done);opacity:.6}
  .card.st-review{border-left-color:var(--review)}
  .card.st-running{border-left-color:var(--running)}
  .card.st-claimed{border-left-color:var(--claimed)}
  .card.st-ready{border-left-color:var(--ready)}
  .card.st-waiting,.card.st-pending{border-left-color:var(--waiting)}
  .card.st-blocked{border-left-color:var(--blocked)}
  .card.st-cancelled{border-left-color:var(--cancelled);border-left-style:dashed;opacity:.6}
  #edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #edges path{fill:none;stroke:var(--line);stroke-width:1.5;marker-end:url(#arw)}
  /* 详情栏 = 只读看板里的 #detailpanel：常驻右侧、占满整页高、同一条分隔线调宽 */
  aside#editor{position:fixed;right:0;top:0;bottom:0;width:var(--detail-w);z-index:60;
               display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);
               box-shadow:-10px 0 30px rgba(16,24,40,.10);overflow:hidden}
  #editbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
           padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:var(--bg);user-select:none}
  #editbar b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  #editbody{padding:14px 16px;font-size:13px;overflow:auto;flex:1 1 auto;min-height:0}
  #editbody h2{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  label{display:block;font-size:12px;color:var(--dim);margin:9px 0 3px}
  input,textarea,select{width:100%;font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--line);
                        border-radius:6px;background:var(--panel);color:var(--ink)}
  textarea{min-height:56px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1;min-width:0}
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  ul.runs{margin:4px 0 0;padding:0 0 0 18px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1 id="title">—</h1>
  <p class="goal" id="goal"></p>
  <div class="meta">
    <span id="progress"></span>
    <span id="rev"></span>
    <span id="msg"></span>
    <span class="spacer"></span>
    <button id="refresh" class="btn" title="重新从数据文件读一遍">刷新</button>
    <button id="addtask" class="btn primary">＋ 任务</button>
  </div>
  <div class="track"><i id="fill" style="width:0"></i></div>
</header>

<main>
  <div id="board">
    <div class="legend" id="legend"></div>
    <div id="lanes"></div>
    <button id="addtask2" class="fullbtn" title="在最后加一条泳道">＋ 任务</button>
    <svg id="edges"><defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs></svg>
  </div>
  <div id="splitter" title="拖动调节详情栏宽度（双击复位）"></div>
  <aside id="editor">
    <div id="editbar"><b>详情</b><button id="clear" class="btn" title="只清内容，边栏常驻不动（Esc）">清空</button></div>
    <div id="editbody"></div>
  </aside>
</main>

<script>
"use strict";
let VIEW = null;         // 服务端算好的一屏数据（派生状态/依赖/认领都由 model 算）
let SEL = null;          // 选中的块 id
let DRAG = null;         // 正在拖的块
const $ = (s) => document.querySelector(s);
// 所有插进 innerHTML 的内容一律先过 esc()（自己的 plan 数据、只绑 127.0.0.1，但一样按不可信处理）
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ZH = {done:"已完成",running:"进行中",claimed:"已认领",review:"待评审",ready:"待认领",
            waiting:"等前置",pending:"待排",blocked:"待批准",cancelled:"已取消"};
// 图例顺序 = 一个块的一生（与只读看板 plan.html 同一份约定）；颜色一律走共用主题的 CSS 变量
const LEGEND = ["blocked","waiting","ready","claimed","running","review","done","cancelled"];
const zh = (s) => ZH[s] || s;
const blockOf = (id) => { for (const t of (VIEW?.tasks||[])) for (const b of t.blocks) if (b.id === id) return [t,b]; return [null,null]; };
// 派生状态和存储值不一样时，说清**为什么**（别一律说成「被依赖挡着」）：
//   pending→waiting 前置没完 / pending→ready 前置已就绪、还没人接 / pending→claimed 已经有人认领
function derivedWhy(b){
  if (b.raw_status !== "pending") return "";
  return {waiting: "，被前置挡着", ready: "，前置已就绪、还没人认领",
          claimed: "，已有人认领、还没开干"}[b.status] || "";
}

function msg(text, cls){ const m = $("#msg"); m.textContent = text || ""; m.className = cls || ""; }

async function api(op, payload, after){
  const body = Object.assign({op, rev: VIEW?.rev || ""}, payload || {});
  const r = await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({ok:false, error:"服务回了非 JSON"}));
  if (!r.ok || !j.ok){ msg("✗ " + (j.error || r.status), "err"); return false; }
  VIEW = j.view; msg("✓ " + (j.msg || "已保存"), "ok");
  if (after) after(j);          // 跨泳道移动会换块 id：先把选中态跟到新 id 上，再画
  render();
  return true;
}

async function load(){
  const r = await fetch("/api/plan");
  const j = await r.json();
  if (!j.ok){ msg("✗ " + j.error, "err"); return; }
  VIEW = j.view; msg("", ""); render();
}

// ---------------------------------------------------------------- 画
function render(){
  if (!VIEW) return;
  const v = VIEW;
  $("#title").textContent = v.title || v.slug;
  $("#goal").textContent = v.goal || "";
  const [done, tot] = v.progress;
  $("#progress").textContent = `${done}/${tot} 块`;
  $("#fill").style.width = (tot ? Math.round(100 * done / tot) : 0) + "%";
  $("#rev").textContent = "rev " + (v.rev || "").slice(0, 12);
  $("#legend").innerHTML = LEGEND.map(s =>
      s === "cancelled"
        ? `<span><i class="zebra"></i>${esc(zh(s))}</span>`
        : `<span><i style="background:var(--${s})"></i>${esc(zh(s))}</span>`).join("")
    + `<span style="opacity:.85">拖动卡片 = 改先后；拖到别的泳道 = 换任务（块 id 与依赖接线自动跟着改）</span>`;
  const lanes = $("#lanes");
  lanes.innerHTML = "";
  for (const t of v.tasks){
    const sec = document.createElement("section");
    sec.className = "lane"; sec.dataset.task = t.id;
    sec.innerHTML =
      `<div class="lanehead"><span class="tid">${esc(t.id)}</span><b>${esc(t.title)}</b>
         <span class="pill ${esc(t.status)}">${esc(zh(t.status))}</span>
         <span class="deps">${t.owner ? "@"+esc(t.owner) : "未指派"}${t.deps.length ? " · 前置 "+t.deps.map(esc).join("、") : ""}</span>
         <span style="margin-left:auto"></span>
         <button class="addblock btn ghost" data-task="${esc(t.id)}">＋ 块</button></div>
       <div class="cards"></div>`;
    const cards = sec.querySelector(".cards");
    for (const b of t.blocks) cards.appendChild(cardEl(b));
    lanes.appendChild(sec);
  }
  document.querySelectorAll("button.addblock").forEach(btn =>
    btn.addEventListener("click", () => newBlockForm(btn.dataset.task)));
  wireDnD();
  drawEdges();
  editor();
}

function cardEl(b){
  const el = document.createElement("div");
  el.className = "card st-" + b.status + (SEL === b.id ? " sel" : "");
  el.dataset.id = b.id; el.draggable = true;
  const ex = b.exec && b.exec.by ? `在做 @${esc(b.exec.by)}` : "";
  el.innerHTML =
    `<div class="cid">${esc(b.id.split("#")[1])}${b.kind ? " · " + esc(b.kind) : ""}${b.rework ? " ⟲"+b.rework : ""}</div>
     <div class="ctitle">${esc(b.title)}</div>
     <div class="cmeta"><span class="pill ${b.status}">${esc(zh(b.status))}</span>
       ${b.owner ? `<span>@${esc(b.owner)}</span>` : ""}${ex ? `<span>${ex}</span>` : ""}</div>`;
  el.addEventListener("click", () => { SEL = (SEL === b.id ? null : b.id); render(); });
  return el;
}

function drawEdges(){
  const svg = $("#edges"), board = $("#board");
  const bb = board.getBoundingClientRect();
  const pos = {};
  document.querySelectorAll(".card").forEach(c => {
    const r = c.getBoundingClientRect();
    const l = r.left - bb.left + board.scrollLeft, rr = r.right - bb.left + board.scrollLeft;
    const t = r.top - bb.top + board.scrollTop, btm = r.bottom - bb.top + board.scrollTop;
    pos[c.dataset.id] = {l, r: rr, t, btm, cx: (l + rr) / 2, y: t + r.height / 2};
  });
  const paths = [];
  for (const [from,to] of (VIEW.edges||[])){
    if (!pos[from] || !pos[to]) continue;
    const a = pos[from], b = pos[to];
    if (b.t >= a.btm - 4){
      // 目标在下面（正常的前向依赖）：从下边缘竖直出去、落到目标上边缘 —— 走线不绕圈
      const d = Math.max(16, (b.t - a.btm) / 2);
      paths.push(`<path d="M${a.cx} ${a.btm} C${a.cx} ${a.btm + d} ${b.cx} ${b.t - d} ${b.cx} ${b.t}"/>`);
    } else {
      // 同一行或回边：右缘 → 左缘
      const mid = (a.r + b.l) / 2;
      paths.push(`<path d="M${a.r} ${a.y} C${mid} ${a.y} ${mid} ${b.y} ${b.l} ${b.y}"/>`);
    }
  }
  svg.innerHTML = `<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker></defs>` + paths.join("");
  svg.style.height = board.scrollHeight + "px";
}
window.addEventListener("resize", () => drawEdges());
document.addEventListener("scroll", () => drawEdges(), true);

// ---------------------------------------------------------------- 拖 = 改先后（同泳道）+ 换任务（跨泳道）
// 跨泳道 drop 走 `move` op：块的 id 与引用它的 deps / review_of 由服务端的 edits.move_block 一次改对；
// 成环时服务端拒改（400），前端只把原因显示出来。
function moveTo(from, to, at){
  // `from` 是块 id、`to` 是任务（泳道）id —— 两者都用各自的表查，别混
  if (!blockOf(from)[0] || !(VIEW.tasks || []).some(t => t.id === to)) return;
  api("move", {ref: from, task: to, index: at}, (j) => { SEL = j.ref || null; });
}

function wireDnD(){
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("dragstart", e => {
      DRAG = {id: card.dataset.id};
      e.dataTransfer.setData("text/plain", card.dataset.id);
      card.classList.add("drag");
    });
    card.addEventListener("dragend", () => { card.classList.remove("drag"); DRAG = null; });
    card.addEventListener("dragover", e => e.preventDefault());
    card.addEventListener("drop", e => {
      e.preventDefault(); e.stopPropagation();
      if (!DRAG || DRAG.id === card.dataset.id) return;
      const drag = DRAG.id, onto = card.dataset.id;
      const [t1] = blockOf(drag), [t2] = blockOf(onto);
      if (!t1 || !t2) return;
      if (t1.id !== t2.id){                      // 跨泳道：插在这张卡前面
        const at = t2.blocks.findIndex(b => b.id === onto);
        moveTo(drag, t2.id, at < 0 ? null : at);
        return;
      }
      const ids = t1.blocks.map(b => b.id).filter(x => x !== drag);
      ids.splice(ids.indexOf(onto), 0, drag);
      api("reorder", {task: t1.id, order: ids, ref: drag}, () => { SEL = drag; });
    });
  });
  document.querySelectorAll(".lane").forEach(lane => {
    const cards = lane.querySelector(".cards");
    cards.addEventListener("dragover", e => { e.preventDefault(); cards.classList.add("over"); });
    cards.addEventListener("dragleave", () => cards.classList.remove("over"));
    cards.addEventListener("drop", e => {          // 落在泳道空白处 = 追加到这条泳道末尾
      cards.classList.remove("over");
      if (!DRAG) return;
      const drag = DRAG.id;
      const [tFrom] = blockOf(drag);
      if (!tFrom || tFrom.id === lane.dataset.task) return;   // 同泳道落空白处：不动（拖到卡片之间才是排序）
      moveTo(drag, lane.dataset.task, null);
    });
  });
}

// ---------------------------------------------------------------- 右栏
function field(label, id, value, tag){
  const t = tag || "input";
  const v = tag === "textarea" ? esc(value) : esc(value);
  return `<label for="${id}">${label}</label><${t} id="${id}">${v}</${t}>`;
}
function select(id, options, cur, zhMap){
  return `<select id="${id}">` + options.map(o =>
    `<option value="${esc(o)}"${o === cur ? " selected" : ""}>${esc(zhMap ? zhMap(o) : o)}</option>`).join("") + "</select>";
}

function editor(){
  const box = $("#editbody");
  if (NEWFORM){ box.innerHTML = NEWFORM.html; wireNewForm(); return; }
  const [t,b] = SEL ? blockOf(SEL) : [null,null];
  if (!b){
    box.innerHTML = `<h2>画布</h2><p class="goal">点一个块来编辑；拖卡片改先后，拖到别的泳道 = 换任务。</p>
      <div class="kv">数据文件：<code>${esc(VIEW.file)}</code><br>
      每次保存都会写回这份 json，并同步 PLAN.md / plan.html / plan.canvas。</div>
      <div class="kv">能改：标题 · 做什么 · 判据 · 认领人 · 类型 · 状态（含送审 / 打回 / 收工）· 新建任务与块 · 拖块换先后 / 换任务。<br>
      跨泳道拖 = 块换 id（<code>T-00N#B-00N</code> 里第一段跟着换）+ 引用它的 <code>deps</code>/<code>review_of</code>
      自动重接；会让依赖成环时拒改并把原因说出来。<br>
      暂不提供：删块、删任务、直接改依赖接线 —— 走命令（<code>rm</code> / <code>move</code> / <code>expand</code> / <code>collapse</code>）更安全。</div>`;
    return;
  }
  const parts = VIEW.participants.map(p => `<option value="${esc(p.id)}">`).join("");
  box.innerHTML = `
    <h2>${esc(b.id)} <span class="pill ${b.status}">${esc(zh(b.status))}</span></h2>
    <p class="goal">派生状态由依赖与认领算出：<b>${esc(zh(b.status))}</b>${b.status !== b.raw_status ? `（内部 ${esc(b.raw_status)}${derivedWhy(b)}）` : ""}</p>
    <label for="f_title">标题</label><input id="f_title" value="${esc(b.title)}">
    <label for="f_doc">做什么（doc）</label><textarea id="f_doc">${esc(b.doc)}</textarea>
    <label for="f_done">判据（一行一条）</label><textarea id="f_done">${esc((b.done_when||[]).join("\n"))}</textarea>
    <div class="row">
      <div><label for="f_owner">认领人</label><input id="f_owner" list="people" value="${esc(b.owner)}"><datalist id="people">${parts}</datalist></div>
      <div><label for="f_kind">类型</label>${select("f_kind", VIEW.kinds, b.kind)}</div>
    </div>
    <div class="row">
      <div><label for="f_status">状态</label>${select("f_status", VIEW.block_statuses, b.status, zh)}</div>
      <div><label for="f_by">在做（--by）</label><input id="f_by" list="people" value="${esc((b.exec||{}).by||"")}"></div>
    </div>
    <label for="f_note">说明（改状态的 note；打回时落进 feedback）</label><input id="f_note" value="">
    <div class="btns">
      <button class="btn primary" id="save">保存字段</button>
      <button class="btn" id="setst">改状态</button>
      <button class="btn ghost" id="rework" title="回到「已认领」，note 落进 feedback">打回重做</button>
    </div>
    <div class="kv">归属 ${esc(t.id)} ${esc(t.title)} · 依赖 ${(b.deps||[]).length ? b.deps.map(esc).join("、") : "—"}
      ${b.review_of ? "<br>评审对象 <code>" + esc(b.review_of) + "</code>" : ""}
      ${b.feedback ? "<br>feedback：" + esc(b.feedback) : ""}
      ${(b.artifacts||[]).length ? "<br>产物：" + b.artifacts.map(esc).join("<br>") : ""}
      ${(b.exec||{}).delegation ? "<br>线程 <code>" + esc(b.exec.delegation) + "#" + esc(b.exec.task_index||0) + "</code>" : ""}</div>
    ${(b.runs||[]).length ? "<div class='kv'>最近 run：<ul class='runs'>" +
      b.runs.map(r => `<li>${esc((r.at||"").replace("T"," ").slice(0,16))} ${esc(r.by||"")} ${esc(r.from||"")}→${esc(r.to||"")} ${esc(r.note||"")}</li>`).join("") + "</ul></div>" : ""}`;
  const val = (id) => $("#" + id).value;
  const fields = () => ({ref: b.id, title: val("f_title"), doc: val("f_doc"),
                         done_when: val("f_done").split("\n").map(s => s.trim()).filter(Boolean),
                         owner: val("f_owner"), kind: val("f_kind"), by: val("f_by"), note: val("f_note")});
  $("#save").addEventListener("click", () => api("edit", fields()));
  $("#setst").addEventListener("click", () => api("status", Object.assign(fields(), {status: val("f_status")})));
  $("#rework").addEventListener("click", () => api("status", Object.assign(fields(), {status: "claimed"})));
}

// ---------------------------------------------------------------- 新建
let NEWFORM = null;
let taskOfNewForm = "";
function newBlockForm(taskId){
  SEL = null; taskOfNewForm = taskId;
  NEWFORM = {html: `<h2>在 ${esc(taskId)} 里新建块</h2>
    <label for="n_title">标题</label><input id="n_title">
    <label for="n_doc">做什么（doc）</label><textarea id="n_doc"></textarea>
    <label for="n_done">判据（一行一条，可核验）</label><textarea id="n_done"></textarea>
    <div class="row">
      <div><label for="n_kind">类型</label>${select("n_kind", VIEW.kinds, "impl")}</div>
      <div><label for="n_status">初始状态</label>${select("n_status", ["pending","blocked"], "pending", zh)}</div>
    </div>
    <label for="n_owner">认领人</label><input id="n_owner" list="people">
    <div class="btns"><button class="btn primary" id="n_go">新建</button><button class="btn" id="n_cancel">取消</button></div>
    <p class="goal">默认「待排」（<code>pending</code>）—— 你就是在画布上批准它的人；要留给人点头就选「待批准」。</p>`};
  render();
}
function newTaskForm(){
  SEL = null;
  NEWFORM = {html: `<h2>新建任务（泳道）</h2>
    <label for="n_title">标题</label><input id="n_title">
    <label for="n_owner">认领人</label><input id="n_owner" list="people">
    <label for="n_deps">前置任务（逗号分隔，可空）</label><input id="n_deps">
    <div class="btns"><button class="btn primary" id="n_go">新建</button><button class="btn" id="n_cancel">取消</button></div>`};
  render();
}
function wireNewForm(){
  $("#n_cancel").addEventListener("click", () => { NEWFORM = null; render(); });
  $("#n_go").addEventListener("click", async () => {
    const title = $("#n_title").value.trim();
    const owner = $("#n_owner") ? $("#n_owner").value.trim() : "";
    if (!title){ msg("✗ 要有标题", "err"); return; }
    const isBlock = !!$("#n_done");
    const payload = isBlock
      ? {task: taskOfNewForm,
         title, doc: $("#n_doc").value, done_when: $("#n_done").value.split("\n").map(s=>s.trim()).filter(Boolean),
         kind: $("#n_kind").value, status: $("#n_status").value, owner}
      : {title, owner, deps: $("#n_deps").value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean)};
    const ok = await api(isBlock ? "block" : "task", payload);
    if (ok) NEWFORM = null;
    render();
  });
}

// ---------------------------------------------------------------- 详情栏宽度（拖动 / 双击复位）
// 与只读看板 plan.html 同一套：CSS 变量同名 --detail-w，手感同一条 #splitter（样式在共用主题里）
const DETAILW_DEFAULT = 390, DETAILW_MIN = 280, BOARD_MIN = 340;
const detailW = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue("--detail-w")) || DETAILW_DEFAULT;
function setDetailW(w, save){
  const max = Math.max(DETAILW_MIN, window.innerWidth - BOARD_MIN);
  w = Math.max(DETAILW_MIN, Math.min(max, Math.round(w)));
  document.documentElement.style.setProperty("--detail-w", w + "px");
  if (save) { try { localStorage.setItem("loomerto.canvas.detailw", String(w)); } catch(e) {} }
  drawEdges();                       // 画布宽度变了，依赖连线要重画
  return w;
}
(function initSplitter(){
  try {
    const saved = parseInt(localStorage.getItem("loomerto.canvas.detailw") || "0", 10);
    if (saved) setDetailW(saved, false);
  } catch(e) {}
  const sp = $("#splitter");
  sp.addEventListener("dblclick", () => setDetailW(DETAILW_DEFAULT, true));
  sp.addEventListener("mousedown", e => {
    e.preventDefault();
    sp.classList.add("dragging"); document.body.classList.add("resizing");
    const move = ev => setDetailW(window.innerWidth - ev.clientX, false);
    const up = ev => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      sp.classList.remove("dragging"); document.body.classList.remove("resizing");
      setDetailW(window.innerWidth - ev.clientX, true);
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });
  window.addEventListener("resize", () => setDetailW(detailW(), false));   // 窗口变窄时把它夹回来
})();

// ---------------------------------------------------------------- 启动
$("#refresh").addEventListener("click", load);
$("#addtask").addEventListener("click", newTaskForm);
$("#addtask2").addEventListener("click", newTaskForm);      // 泳道下方那条全宽按钮
$("#clear").addEventListener("click", () => { SEL = null; NEWFORM = null; render(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ NEWFORM = null; SEL = null; render(); }
});
load();
</script>
